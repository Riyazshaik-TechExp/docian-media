<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Docian AI – daily videos</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f6f5f2;color:#1d1d1f}
header{padding:24px 20px 8px;max-width:1100px;margin:auto}h1{margin:0;font-size:24px}p.sub{color:#666;margin:6px 0 0}
main{max-width:1100px;margin:auto;padding:8px 20px 40px}
.day{background:#fff;border-radius:14px;padding:18px;margin:18px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.day h2{margin:0 0 4px;font-size:19px}.count{color:#666;font-size:14px}
.type{margin-top:16px;border-top:1px solid #eee;padding-top:14px}
.type h3{margin:0;font-size:16px}.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;margin-left:6px;background:#eef}
.concept{color:#555;font-size:14px;margin:4px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.v{background:#fafafa;border:1px solid #eee;border-radius:10px;padding:10px}
.v video{width:100%;border-radius:8px;background:#000;aspect-ratio:9/16}
.v b{display:block;margin:6px 0 2px}.v a{font-size:14px;margin-right:10px}
.missing{display:flex;align-items:center;justify-content:center;aspect-ratio:9/16;border:2px dashed #ccc;border-radius:8px;color:#888;text-align:center;padding:10px}
</style></head><body>
<header><h1>Docian AI – daily videos</h1>
<p class="sub">Every day: 2 concepts. Concept 1 is the glass video, concept 2 is the brand film. Each comes in English and Telugu, so 4 videos a day. Files: v/&lt;day&gt;/&lt;glass|brand&gt;/&lt;language&gt;-c&lt;id&gt;.mp4</p></header>
<main id="days">Loading…</main>
<script>
const L={en:"English",te:"Telugu"},T={glass:"Glass video",brand:"Brand film"};
fetch("days.json?"+Date.now()).then(r=>r.json()).then(days=>{
 const m=document.getElementById("days");m.innerHTML="";
 for(const [day,set] of Object.entries(days)){
  const d=document.createElement("section");d.className="day";
  let n=0;for(const t of ["glass","brand"])n+=Object.keys((set[t]||{}).videos||{}).length;
  d.innerHTML=`<h2>${day}</h2><div class="count">${n} of 4 videos ready</div>`;
  ["glass","brand"].forEach((t,i)=>{
   const s=set[t]||{videos:{}};const b=document.createElement("div");b.className="type";
   b.innerHTML=`<h3>Concept ${i+1}: ${T[t]}<span class="tag">${t}</span></h3><div class="concept">${s.feature||""}${s.pain?" — "+s.pain:""}</div>`;
   const g=document.createElement("div");g.className="grid";
   for(const lang of ["en","te"]){const v=s.videos[lang];const c=document.createElement("div");c.className="v";
    c.innerHTML=v?`<video controls preload="metadata" src="${v.preview_url}"></video><b>${L[lang]} · c${v.content_id}</b><a href="${v.preview_url}">Open video</a><a href="${v.decide_url}">Approve / reject</a>`
                 :`<div class="missing">${L[lang]} ${T[t].toLowerCase()}<br>still rendering</div><b>${L[lang]}</b>`;
    g.appendChild(c);}
   b.appendChild(g);d.appendChild(b);});
  m.appendChild(d);}
}).catch(()=>{document.getElementById("days").textContent="No daily sets yet."});
</script></body></html>
